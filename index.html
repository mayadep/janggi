<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>장기 JangGi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- 로비 -->
  <section id="lobby" class="screen active">
    <div class="lobby-card">
      <div class="logo">
        <div class="logo-piece"><span>將</span></div>
        <div>
          <h1>장기</h1>
          <p class="sub">JANGGI · 한국 장기 온라인</p>
        </div>
      </div>

      <div class="profile">
        <div class="rank-badge" id="lobbyRankBadge">18급</div>
        <div class="profile-info">
          <div class="profile-name">나 <span class="rating" id="lobbyRating">800</span></div>
          <div class="progress"><div class="progress-fill" id="lobbyProgress"></div></div>
          <div class="progress-label" id="lobbyProgressLabel">다음 등급까지 50점</div>
        </div>
      </div>

      <div class="record" id="lobbyRecord">
        <div><b id="recW">0</b><span>승</span></div>
        <div><b id="recL">0</b><span>패</span></div>
        <div><b id="recD">0</b><span>무</span></div>
        <div><b id="recRate">-</b><span>승률</span></div>
      </div>

      <div class="field">
        <div class="field-label">내 상차림</div>
        <div class="formations" id="formations"></div>
      </div>

      <button class="btn primary big" id="btnMatch">대국 시작</button>
      <p class="hint">매칭을 시작하고 5초가 지나면 비슷한 등급의 AI 상대와 자동으로 대국합니다.</p>
      <button class="link-btn" id="btnReset">기록 초기화</button>
    </div>
  </section>

  <!-- 매칭 -->
  <section id="matching" class="screen">
    <div class="radar">
      <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
      <div class="sweep"></div>
      <div class="radar-center" id="matchMyRank">18급</div>
    </div>
    <h2 id="matchTitle">상대를 찾는 중</h2>
    <p id="matchSub">비슷한 등급의 상대를 찾고 있습니다</p>
    <div class="match-timer"><span id="matchTime">0</span>초</div>
    <button class="btn ghost" id="btnCancelMatch">취소</button>
  </section>

  <!-- 대전 상대 소개 -->
  <section id="versus" class="screen">
    <div class="vs-wrap">
      <div class="vs-card me">
        <div class="avatar big" id="vsMeAvatar">나</div>
        <div class="vs-name">나</div>
        <div class="rank-badge" id="vsMeRank">18급</div>
        <div class="vs-color" id="vsMeColor">초 (선)</div>
      </div>
      <div class="vs-text">VS</div>
      <div class="vs-card opp">
        <div class="avatar big" id="vsOppAvatar">?</div>
        <div class="vs-name" id="vsOppName">상대</div>
        <div class="rank-badge" id="vsOppRank">18급</div>
        <div class="vs-color" id="vsOppColor">한 (후)</div>
      </div>
    </div>
    <p class="vs-note">AI 상대와 매칭되었습니다</p>
  </section>

  <!-- 게임 -->
  <section id="game" class="screen">
    <div class="game-layout">
      <div class="board-column">
        <div class="player-bar top" id="barTop">
          <div class="avatar" id="oppAvatar">?</div>
          <div class="pinfo">
            <div class="pname"><span id="oppName">상대</span> <span class="ai-tag">AI</span></div>
            <div class="pmeta"><span class="rank-chip" id="oppRank">18급</span><span class="color-chip" id="oppColor">한</span><span class="score" id="oppScore">73.5점</span></div>
          </div>
          <div class="captured" id="capTop"></div>
          <div class="thinking" id="thinking"><i></i><i></i><i></i></div>
          <div class="clock" id="clockTop">15</div>
          <div class="timebar"><i id="timeTop"></i></div>
        </div>

        <div class="board-frame" id="boardFrame">
          <div class="board" id="board">
            <canvas id="boardCanvas"></canvas>
            <div class="marks" id="marks"></div>
            <div class="pieces" id="pieces"></div>
            <div class="hints" id="hints"></div>
          </div>
          <div class="flash" id="flash"></div>
          <div class="banner" id="banner"></div>
        </div>

        <div class="player-bar bottom" id="barBottom">
          <div class="avatar me">나</div>
          <div class="pinfo">
            <div class="pname">나</div>
            <div class="pmeta"><span class="rank-chip" id="myRank">18급</span><span class="color-chip" id="myColor">초</span><span class="score" id="myScore">72점</span></div>
          </div>
          <div class="captured" id="capBottom"></div>
          <div class="turn-dot" id="myTurn">내 차례</div>
          <div class="clock" id="clockBottom">15</div>
          <div class="timebar"><i id="timeBottom"></i></div>
        </div>

        <div class="action-bar">
          <div class="status" id="status">대국 준비</div>
          <div class="controls">
            <button class="btn" id="btnPass">한 수 쉼</button>
            <button class="btn danger" id="btnResign">기권</button>
            <button class="btn icon" id="btnSound" title="소리">🔊</button>
          </div>
        </div>
      </div>

    </div>
  </section>

  <!-- 결과 -->
  <div class="modal" id="resultModal">
    <div class="modal-card">
      <div class="result-title" id="resultTitle">승리</div>
      <div class="result-reason" id="resultReason">외통수</div>
      <div class="result-rank">
        <div class="rank-badge large" id="resultRank">18급</div>
        <div class="rating-change" id="resultDelta">+20</div>
        <div class="rank-up" id="resultRankUp"></div>
      </div>
      <div class="modal-actions">
        <button class="btn primary" id="btnAgain">다시 매칭</button>
        <button class="btn ghost" id="btnLobby">로비로</button>
      </div>
    </div>
  </div>

  <div class="modal" id="confirmModal">
    <div class="modal-card small">
      <div class="confirm-text">정말 기권하시겠습니까?</div>
      <div class="modal-actions">
        <button class="btn danger" id="btnConfirmYes">기권</button>
        <button class="btn ghost" id="btnConfirmNo">계속 두기</button>
      </div>
    </div>
  </div>
</div>

<script src="js/rules.js"></script>
<script src="js/ai.js"></script>
<script src="js/rank.js"></script>
<script src="js/game.js"></script>
</body>
</html>
